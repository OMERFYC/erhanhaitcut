<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Erhan Cut | Luxury VIP Experience</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #d4af37; 
            --gold-hover: #f1c40f; 
            --bg: #0a0a0a; 
            --card: rgba(21, 21, 21, 0.98); 
            --text: #e0e0e0; 
        }

        /* Splash Screen */
        #loader-wrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .loader-logo {
            font-size: clamp(30px, 10vw, 50px);
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-align: center;
            animation: pulse 2s infinite;
        }
        .loader-bar {
            width: 150px;
            height: 2px;
            background: #222;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }
        .loader-progress {
            width: 0%;
            height: 100%;
            background: var(--gold);
            position: absolute;
            animation: load 2.5s forwards ease-in-out;
        }
        .loader-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        @keyframes pulse {
            0%, 100% { transform: scale(0.98); opacity: 0.7; }
            50% { transform: scale(1.02); opacity: 1; }
        }
        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }

        /* Ana Sayfa Styles */
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&q=80&w=2070'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            padding: 20px 0; 
        }

        .container { 
            background: var(--card); 
            padding: 30px 20px; 
            border-radius: 12px; 
            border-top: 5px solid var(--gold); 
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9); 
            width: 92%; 
            max-width: 400px; 
            text-align: center; 
            box-sizing: border-box;
            margin-bottom: 30px;
        }

        h1 { color: var(--gold); letter-spacing: 3px; margin: 0; font-size: 32px; font-weight: 900; }
        .subtitle { color: #777; font-size: 10px; letter-spacing: 3px; margin-bottom: 25px; text-transform: uppercase; }
        
        label { display: block; text-align: left; font-size: 11px; color: var(--gold); margin: 0 0 6px 4px; font-weight: bold; text-transform: uppercase; }
        
        /* Mobile optimization for inputs */
        input, select, textarea { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #151515; 
            color: white; 
            outline: none; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
            font-size: 16px; /* iOS zoom engelleme */
        }
        textarea { height: 80px; resize: none; }
        
        .warning-text { 
            background: rgba(212, 175, 55, 0.05); 
            color: var(--gold); 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 12px; 
            margin-bottom: 20px; 
            border: 1px dashed rgba(212, 175, 55, 0.3); 
            line-height: 1.4;
        }
        
        button { 
            width: 100%; 
            padding: 18px; 
            background: var(--gold); 
            border: none; 
            color: #000; 
            font-weight: 800; 
            cursor: pointer; 
            border-radius: 8px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            transition: 0.3s;
            font-size: 14px;
        }
        button:active { transform: scale(0.98); }

        .dev-footer { margin-top: 20px; font-size: 10px; color: #555; line-height: 2; }
        .dev-link { color: var(--gold); text-decoration: none; font-weight: bold; }

        /* Social Media Panel - Optimized for Mobile */
        .side-contact { 
            position: fixed; 
            top: 20px; 
            left: 20px; 
            background: var(--card); 
            padding: 15px; 
            border-radius: 12px; 
            border-left: 4px solid var(--gold); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            z-index: 999; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        @media (max-width: 768px) {
            .side-contact { 
                position: relative; 
                top: 0; left: 0; 
                flex-direction: row; 
                justify-content: center;
                flex-wrap: wrap;
                width: 92%;
                max-width: 400px;
                margin-bottom: 15px;
                border-left: none;
                border-bottom: 3px solid var(--gold);
                padding: 12px;
            }
            .side-label { display: none; }
            .side-contact-item span { display: none; } /* Mobilde sadece ikonlar kalsın */
            .side-contact-item { font-size: 20px; padding: 5px 15px; }
        }

        .side-contact-item { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-size: 13px; transition: 0.3s; }
        .fa-instagram { color: #E1306C; }
        .fa-tiktok { color: #fff; }
        .fa-whatsapp { color: #25D366; }
        .side-label { color: var(--gold); font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #333; padding-bottom: 5px; }

        /* Admin Panel Mobile Optimization */
        #adminOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 10000; padding: 10px; box-sizing: border-box; }
        .admin-content { width: 100%; max-width: 900px; margin: 20px auto; background: #111; padding: 15px; border-radius: 10px; border: 1px solid var(--gold); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; } /* Tablonun ezilmesini önler */
        th, td { padding: 12px 8px; text-align: left; font-size: 12px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

<div id="loader-wrapper">
    <div class="loader-logo">ERHAN CUT</div>
    <div class="loader-bar"><div class="loader-progress"></div></div>
    <p style="color: #444; font-size: 10px; margin-top: 15px; letter-spacing: 2px;">LUXURY EXPERIENCE LOADING...</p>
</div>

<div class="side-contact">
    <div class="side-label">İletişim</div>
    <a href="https://instagram.com/erhancutt" target="_blank" class="side-contact-item"><i class="fab fa-instagram"></i><span>erhancutt</span></a>
    <a href="https://tiktok.com/@erhancut" target="_blank" class="side-contact-item"><i class="fab fa-tiktok"></i><span>erhancut</span></a>
    <a href="https://wa.me/905354848015" target="_blank" class="side-contact-item"><i class="fab fa-whatsapp"></i><span>0535 484 80 15</span></a>
</div>

<div class="container">
    <h1>ERHAN CUT</h1>
    <div class="subtitle">Luxury Barber Experience</div>
    
    <form id="appointmentForm">
        <label>ADINIZ VE SOYADINIZ</label>
        <input type="text" id="custName" placeholder="Örn: Ahmet Yılmaz" required>
        
        <label>TELEFON NUMARANIZ</label>
        <input type="tel" id="custPhone" placeholder="05XX XXX XX XX" required>
        
        <label>İSTEDİĞİNİZ HİZMET</label>
        <select id="custService">
            <option value="Saç Kesimi">Modern Saç Kesimi</option>
            <option value="Sakal Tasarımı">Sakal Tasarımı & Bakımı</option>
            <option value="Saç & Sakal">Saç + Sakal Kombin</option>
            <option value="Cilt Bakımı">VIP Cilt Bakımı & Maske</option>
            <option value="Damat Tıraşı">Damat Tıraşı Özel</option>
        </select>
        
        <label>RANDEVU SAATİ</label>
        <select id="custTime" required>
            <option value="">Saat Seçiniz</option>
            <option value="09:00">09:00</option><option value="10:00">10:00</option>
            <option value="11:00">11:00</option><option value="12:00">12:00</option>
            <option value="13:30">13:30</option><option value="14:30">14:30</option>
            <option value="15:30">15:30</option><option value="16:30">16:30</option>
            <option value="17:30">17:30</option><option value="18:30">18:30</option>
            <option value="19:30">19:30</option><option value="20:30">20:30</option>
            <option value="21:15">21:15</option><option value="22:00">22:00</option>
        </select>

        <label>NOTUNUZ (OPSİYONEL)</label>
        <textarea id="custNote" placeholder="Eklemek istediğiniz bir not var mı?"></textarea>

        <div class="warning-text">
            <i class="fas fa-clock"></i> Lütfen randevunuzdan 10 dakika önce salonda olunuz.
        </div>
        
        <button type="submit" id="submitBtn">RANDEVU TALEBİNİ GÖNDER</button>
    </form>
    
    <div class="dev-footer">
        <div id="adminTrigger" style="cursor: pointer; margin-bottom: 5px;">© 2026 ERHAN CUT | TÜM HAKLARI SAKLIDIR</div>
        <a href="https://instagram.com/om3rfyc" target="_blank" class="dev-link">DESIGNED BY @OM3RFYC</a>
    </div>
</div>

<div id="adminOverlay">
    <div class="admin-content">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="color:var(--gold); margin:0; font-size: 18px;">Yönetim Paneli</h2>
            <button onclick="document.getElementById('adminOverlay').style.display='none'" style="width:auto; padding: 8px 15px;">Kapat</button>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Müşteri</th>
                        <th>Telefon</th>
                        <th>Hizmet</th>
                        <th>Saat</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="adminBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    // Firebase ve Logic kısmın aynı kalabilir, sadece input ID'lerini (custNote gibi) küçük düzeltmelerle formuna bağladım.
    // Mevcut Firebase kodunu buraya yapıştırabilirsin.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB0YRC4KEmy9cZQ07DpDhIzYIXopgUrWtQ",
        authDomain: "erhanhaircut.firebaseapp.com",
        projectId: "erhanhaircut",
        storageBucket: "erhanhaircut.firebasestorage.app",
        messagingSenderId: "481833678528",
        appId: "1:481833678528:web:ffab1f5f1075113bc91f25"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    emailjs.init("4fwv8uFfH2Ffj80u-");

    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('loader-wrapper').classList.add('loader-hidden');
        }, 2000);
    });

    async function updateAvailableTimes() {
        const timeSelect = document.getElementById('custTime');
        const options = timeSelect.options;
        try {
            const snap = await getDocs(collection(db, "randevular"));
            const bookedTimes = [];
            snap.forEach(d => bookedTimes.push(d.data().time));
            for (let i = 0; i < options.length; i++) {
                const val = options[i].value;
                if (bookedTimes.includes(val) && val !== "") {
                    options[i].disabled = true; 
                    options[i].innerText = val + " (DOLU)";
                } else if (val !== "") {
                    options[i].disabled = false;
                    options[i].innerText = val;
                }
            }
        } catch (err) { console.error(err); }
    }
    updateAvailableTimes();

    document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const selectedTime = document.getElementById('custTime').value;

        btn.disabled = true; btn.innerText = "GÖNDERİLİYOR...";
        const customerData = {
            name: document.getElementById('custName').value,
            phone: document.getElementById('custPhone').value,
            service: document.getElementById('custService').value,
            time: selectedTime,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "randevular"), customerData);
            await emailjs.send("service_480t845", "template_kvu1ttr", {
                name: customerData.name,
                phone: customerData.phone,
                time: customerData.time,
                service: customerData.service
            });
            alert(`Sayın ${customerData.name}, randevunuz başarıyla alındı!`);
            e.target.reset();
            updateAvailableTimes();
        } catch (err) { alert("Bir hata oluştu, lütfen tekrar deneyin."); }
        btn.disabled = false; btn.innerText = "RANDEVU TALEBİNİ GÖNDER";
    });

    let clicks = 0;
    document.getElementById('adminTrigger').addEventListener('click', () => {
        clicks++;
        if(clicks === 3) {
            if(prompt("Admin Şifresi:") === "erhan123") {
                document.getElementById('adminOverlay').style.display = 'block';
                fetchData();
            }
            clicks = 0;
        }
    });

    async function fetchData() {
        const tbody = document.getElementById('adminBody');
        tbody.innerHTML = "<tr><td colspan='5'>Yükleniyor...</td></tr>";
        const q = query(collection(db, "randevular"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        tbody.innerHTML = "";
        snap.forEach(d => {
            const r = d.data();
            tbody.innerHTML += `<tr>
                <td>${r.name}</td>
                <td><a href="tel:${r.phone}" style="color:var(--gold)">${r.phone}</a></td>
                <td>${r.service}</td>
                <td>${r.time}</td>
                <td><button style="background:#e74c3c; padding:5px 10px;" onclick="window.del('${d.id}')">Sil</button></td>
            </tr>`;
        });
    }

    window.del = async (id) => {
        if(confirm("Bu randevuyu silmek istediğinize emin misiniz?")) {
            await deleteDoc(doc(db, "randevular", id));
            fetchData();
            updateAvailableTimes();
        }
    };
</script>

</body>
</html>
